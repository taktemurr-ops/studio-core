name: kapak render (geçici)
on:
  workflow_dispatch:
  push:
    branches: [tmp-kapak-render]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/zz_kapak_render_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: render
          path: render/
