name: kapak render (geçici)
on:
  workflow_dispatch:
  push:
    branches: [tmp-kapak-render]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/zz_kapak_render_test.dart
      - run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -f render/*.png && git commit -m "render [skip ci]" && git push origin HEAD:tmp-kapak-render-out --force
