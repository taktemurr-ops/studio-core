name: CI - analyze and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # Bütün test/*_test.dart dosyaları açıkça verilir; her dosyanın gerçekten
      # koştuğu çıktıdan denetlenir (bir dosya sessizce atlanırsa CI kırılır).
      - name: Tests (all files)
        run: |
          set -o pipefail
          files=$(ls test/*_test.dart)
          echo "$files"
          flutter test --reporter expanded $files 2>&1 | tee test_out.txt
          for f in $files; do
            grep -q "$f" test_out.txt || { echo "::error::$f koşmadı"; exit 1; }
          done
