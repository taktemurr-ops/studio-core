name: CI - analyze and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # Bütün test/*_test.dart dosyaları açıkça verilir; JSON raporundan her
      # dosyada en az bir testin koştuğu denetlenir (sessiz atlama CI'ı kırar).
      - name: Tests (all files)
        run: |
          files=$(ls test/*_test.dart)
          echo "$files"
          flutter test --reporter expanded --file-reporter json:test_report.json $files
          python3 - $files <<'PY'
          import json, sys
          suites, counts = {}, {}
          for line in open('test_report.json'):
              e = json.loads(line)
              if e.get('type') == 'suite':
                  suites[e['suite']['id']] = e['suite']['path']
              elif e.get('type') == 'testStart' and not e['test']['name'].startswith('loading '):
                  p = suites.get(e['test']['suiteID'], '')
                  counts[p] = counts.get(p, 0) + 1
          bad = [f for f in sys.argv[1:] if not any(k.endswith(f) and v for k, v in counts.items())]
          for k, v in sorted(counts.items()): print(v, k)
          if bad:
              print('::error::koşmayan test dosyaları: ' + ' '.join(bad)); sys.exit(1)
          PY

  # AppGallery (HMS) arka ucu: yalnızca --dart-define=STORE=huawei derlemelerine
  # eklenen alt paket. Kendi bağımlılıklarıyla (huawei_ads, huawei_iap) denetlenir.
  huawei-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/studio_huawei
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
