name: CI - analyze and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # Bütün test/*_test.dart dosyaları açıkça verilir; JSON raporundan her
      # dosyada en az bir testin koştuğu denetlenir (sessiz atlama CI'ı kırar).
      - name: Tests (all files)
        run: |
          files=$(ls test/*_test.dart)
          echo "$files"
          flutter test --reporter expanded --file-reporter json:test_report.json $files
          python3 - $files <<'PY'
          import json, sys
          suites, counts = {}, {}
          for line in open('test_report.json'):
              e = json.loads(line)
              if e.get('type') == 'suite':
                  suites[e['suite']['id']] = e['suite']['path']
              elif e.get('type') == 'testStart' and not e['test']['name'].startswith('loading '):
                  p = suites.get(e['test']['suiteID'], '')
                  counts[p] = counts.get(p, 0) + 1
          bad = [f for f in sys.argv[1:] if not any(k.endswith(f) and v for k, v in counts.items())]
          for k, v in sorted(counts.items()): print(v, k)
          if bad:
              print('::error::koşmayan test dosyaları: ' + ' '.join(bad)); sys.exit(1)
          PY
  # Firestore güvenlik kuralları: emülatörde birim testleri (firebase/tests).
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools@15
      - run: npm ci
        working-directory: firebase/tests
      - run: firebase emulators:exec --only firestore --project demo-studio "cd tests && npm test"
        working-directory: firebase
