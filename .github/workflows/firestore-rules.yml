name: Firestore rules - emulator tests
# firebase/firestore.rules için emülatörde güvenlik testleri
# (firebase/test/rules.test.mjs). Gizli değişken kullanmaz; gerçek projeye
# bağlanmaz (demo-* proje kimliği yalnızca emülatörde çalışır).
on:
  push:
    paths:
      - "firebase/**"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    paths:
      - "firebase/**"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install (lockfile)
        run: npm ci --no-audit --no-fund
      - name: Rules tests on the Firestore emulator
        run: npm test
