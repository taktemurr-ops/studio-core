name: studio_huawei
description: "AppGallery (Huawei, GMS'siz cihazlar) için studio_core mağaza arka ucu: Petal Ads (ödüllü + geçiş reklamı) ve HMS IAP. Yalnızca --dart-define=STORE=huawei derlemelerine eklenir (merkezlerde tool/huawei_flavor.py)."
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Merkezler studio_core'u dependency_overrides ile aynı SHA'ya sabitler.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
  huawei_ads: ^13.4.72
  huawei_iap: ^6.13.0

# Yalnızca bu paketin kendi CI denetimi için (bir merkeze bağımlılık olarak
# eklendiğinde yok sayılır).
dependency_overrides:
  studio_core:
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
